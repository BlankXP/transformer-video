server:
  port: 8000

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  dashscope-api-key: ${DASHSCOPE_API_KEY:}
  openrouter-api-key: ${OPENROUTER_API_KEY:}
  openrouter-model: ${OPENROUTER_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
  temp-dir: ${TEMP_DIR:./temp}
  max-video-duration: ${MAX_VIDEO_DURATION:3600}
  audio-segment-duration: ${AUDIO_SEGMENT_DURATION:300}
  asr-model: ${ASR_MODEL:paraformer-realtime-v2}
  translation-model: ${TRANSLATION_MODEL:qwen-plus}
  # 以下三项没有默认值：未配置或强度不足时应用拒绝启动，见 StartupConfigValidator
  auth-username: ${AUTH_USERNAME:admin}
  auth-password: ${AUTH_PASSWORD:}
  jwt-secret: ${JWT_SECRET:}
  jwt-expiration: ${JWT_EXPIRATION:86400000}
  task-retention-hours: ${TASK_RETENTION_HOURS:24}
