services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - temp-data:/app/temp
    environment:
      - APP_DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  temp-data:
