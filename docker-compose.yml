services:
  backend:
    build:
      context: ./backend
    network_mode: host
    volumes:
      - temp-data:/app/temp
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  temp-data:
