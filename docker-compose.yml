services:
  backend:
    build:
      context: ./backend
    network_mode: host
    volumes:
      - temp-data:/app/temp
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  temp-data:
