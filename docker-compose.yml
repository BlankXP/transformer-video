services:
  backend:
    build:
      # 前端已合并进后端：构建上下文为仓库根目录，镜像内先构建前端再打进 jar
      context: .
      dockerfile: backend/Dockerfile
    # 单容器同时提供页面、API 与 WebSocket，直接对外暴露 80
    ports:
      - "80:8000"
    volumes:
      - ./backend/temp:/app/temp
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
