<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Translator 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <h1>Video Translator 设置</h1>

    <section class="settings-section">
      <h2>🔑 API 配置</h2>
      <div class="setting-group">
        <label for="asr-provider">ASR 服务</label>
        <select id="asr-provider">
        </select>
      </div>
      <div class="setting-group" id="asr-key-group">
        <label for="asr-api-key">API Key</label>
        <input type="password" id="asr-api-key" placeholder="输入 ASR API Key">
      </div>
      <div class="setting-group">
        <label for="translate-provider">翻译服务</label>
        <select id="translate-provider">
        </select>
      </div>
      <div class="setting-group" id="translate-key-group">
        <label for="translate-api-key">API Key</label>
        <input type="password" id="translate-api-key" placeholder="输入翻译 API Key">
      </div>
    </section>

    <section class="settings-section">
      <h2>🌐 语言偏好</h2>
      <div class="setting-group">
        <label for="default-target-lang">默认目标语言</label>
        <select id="default-target-lang">
        </select>
      </div>
      <div class="setting-group">
        <label for="auto-detect-source">自动检测源语言</label>
        <input type="checkbox" id="auto-detect-source">
      </div>
      <div class="setting-group">
        <label for="default-source-lang">默认源语言</label>
        <input type="text" id="default-source-lang" placeholder="如 en, ja, ko">
      </div>
    </section>

    <section class="settings-section">
      <h2>🎨 字幕样式</h2>
      <div class="setting-group">
        <label for="subtitle-font-size">字体大小</label>
        <input type="number" id="subtitle-font-size" min="12" max="32" value="18">
        <span>px</span>
      </div>
      <div class="setting-group">
        <label for="subtitle-font-color">字体颜色</label>
        <input type="color" id="subtitle-font-color" value="#FFFFFF">
      </div>
      <div class="setting-group">
        <label for="subtitle-bg-color">背景颜色</label>
        <input type="text" id="subtitle-bg-color" value="rgba(0,0,0,0.7)">
      </div>
      <div class="setting-group">
        <label for="subtitle-position">位置</label>
        <select id="subtitle-position">
          <option value="bottom">底部</option>
          <option value="top">顶部</option>
        </select>
      </div>
      <div class="setting-group">
        <label for="subtitle-opacity">透明度</label>
        <input type="range" id="subtitle-opacity" min="0" max="1" step="0.1" value="0.9">
      </div>
    </section>

    <section class="settings-section">
      <h2>⚡ 高级设置</h2>
      <div class="setting-group">
        <label for="segment-duration">音频分段时长</label>
        <input type="number" id="segment-duration" min="5" max="15" value="8">
        <span>秒</span>
      </div>
      <div class="setting-group">
        <label for="cache-enabled">翻译缓存</label>
        <input type="checkbox" id="cache-enabled">
      </div>
      <div class="setting-group">
        <label for="auto-switch-provider">翻译服务商自动切换</label>
        <input type="checkbox" id="auto-switch-provider">
      </div>
    </section>

    <div class="actions">
      <button id="save-btn" class="btn-primary">保存设置</button>
      <span id="save-status" class="save-status"></span>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
